<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speakwrite — Verify Post</title>
  <meta name="description" content="Verify that a post was typed by a human on a genuine Apple device using Speakwrite's cryptographic proof.">
  <meta property="og:title" content="Speakwrite — Verify Post">
  <meta property="og:description" content="Client-side verification of App Attest proofs. No server. No trust required.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .verify-container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 2rem 1.5rem 3rem;
    }

    .verify-header {
      padding: 1.5rem 0;
    }

    .verify-header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--accent);
      text-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
      margin-bottom: 0.4rem;
    }

    .verify-header p {
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    /* Post card */
    .post-card {
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      padding: 1.25rem;
      margin: 1rem 0;
    }

    .post-author {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.75rem;
    }

    .post-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--bg-surface);
      object-fit: cover;
    }

    .post-author-info {
      display: flex;
      flex-direction: column;
    }

    .post-display-name {
      font-weight: 600;
      color: #fff;
      font-size: 0.9rem;
    }

    .post-handle {
      color: var(--text-secondary);
      font-size: 0.8rem;
    }

    .post-text {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-primary);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .post-date {
      color: var(--text-secondary);
      font-size: 0.8rem;
      margin-top: 0.75rem;
    }

    /* Verification steps */
    .verify-steps {
      margin: 1.5rem 0;
    }

    .verify-step {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.5rem 0;
      font-size: 0.85rem;
    }

    .step-icon {
      flex-shrink: 0;
      width: 20px;
      text-align: center;
      font-weight: 600;
    }

    .step-icon.pending { color: var(--text-secondary); }
    .step-icon.running { color: var(--accent); }
    .step-icon.pass { color: var(--accent); }
    .step-icon.fail { color: #ff4444; }

    .step-label { color: var(--text-primary); }
    .step-label.pending { color: var(--text-secondary); }
    .step-detail {
      color: var(--text-secondary);
      font-size: 0.8rem;
      margin-left: 1.75rem;
      margin-top: 0.15rem;
    }

    /* Result banner */
    .result-banner {
      border: 1px solid var(--border);
      padding: 1.25rem;
      margin: 1.5rem 0;
      text-align: center;
    }

    .result-banner.verified {
      border-color: var(--accent-dim);
      background: rgba(0, 255, 65, 0.04);
    }

    .result-banner.failed {
      border-color: #ff4444;
      background: rgba(255, 68, 68, 0.04);
    }

    .result-banner h2 {
      margin-bottom: 0.4rem;
    }

    .result-banner.verified h2 { color: var(--accent); }
    .result-banner.failed h2 { color: #ff4444; }

    .result-banner p {
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* CTA */
    .verify-cta {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .verify-cta h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .verify-cta p {
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-bottom: 0.75rem;
    }

    .btn-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 0.5rem 1rem;
      font-family: var(--font);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
    }

    .btn-primary {
      color: var(--bg-primary);
      background: var(--accent);
      border: 1px solid var(--accent);
    }
    .btn-primary:hover {
      background: transparent;
      color: var(--accent);
    }

    .btn-secondary {
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    /* Error state */
    .error-message {
      color: #ff4444;
      padding: 2rem 0;
    }

    /* Input form */
    .verify-form {
      margin: 1rem 0;
    }

    .verify-form label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }

    .verify-input {
      flex: 1;
      font-family: var(--font);
      font-size: 0.85rem;
      padding: 0.6rem 0.8rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      outline: none;
    }

    .verify-input::placeholder {
      color: var(--text-secondary);
    }

    .verify-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-glow);
    }

    .verify-btn {
      font-family: var(--font);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.6rem 1.2rem;
      background: var(--accent);
      color: var(--bg-primary);
      border: 1px solid var(--accent);
      cursor: pointer;
    }

    .verify-btn:hover {
      background: transparent;
      color: var(--accent);
    }

    .input-hint {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 0.4rem;
    }

    @media (max-width: 480px) {
      .input-row { flex-direction: column; }
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a href="/" class="wordmark">speakwrite</a>
      <div class="nav-links">
        <a href="/#protocol" class="nav-link">Protocol</a>
        <a href="https://github.com/stefanrosscohen/speakwrite" class="nav-link">GitHub</a>
      </div>
    </nav>
  </header>

  <div class="verify-container">
    <div class="verify-header">
      <h1>Verify Post</h1>
      <p>Client-side cryptographic verification. No server. No trust required.</p>
    </div>

    <div id="input-section" style="display:none;">
      <div class="verify-form">
        <label for="post-url">Paste a Bluesky post URL or AT URI</label>
        <div class="input-row">
          <input type="text" id="post-url" class="verify-input" placeholder="https://bsky.app/profile/handle/post/rkey" autocomplete="off">
          <button onclick="verifyFromInput()" class="verify-btn">Verify</button>
        </div>
        <div class="input-hint">e.g. https://bsky.app/profile/stefans.house/post/3abc... or at://did:plc:.../app.bsky.feed.post/3abc...</div>
      </div>
    </div>

    <div id="content">
      <div class="verify-step">
        <span class="step-icon running spinner">⟳</span>
        <span class="step-label">Loading post...</span>
      </div>
    </div>
  </div>

  <script>
    // ── Config ──
    const APPLE_APP_ATTEST_ROOT_CA_PEM = `-----BEGIN CERTIFICATE-----
MIICITCCAaegAwIBAgIQC/O+DvHN0uD7jG5yH2IXmDAKBggqhkjOPQQDAzBSMSYw
JAYDVQQDDB1BcHBsZSBBcHAgQXR0ZXN0YXRpb24gUm9vdCBDQTETMBEGA1UECgwK
QXBwbGUgSW5jLjETMBEGA1UECAwKQ2FsaWZvcm5pYTAeFw0yMDAzMTgxODMyNTNa
Fw00NTAzMTUwMDAwMDBaMFIxJjAkBgNVBAMMHUFwcGxlIEFwcCBBdHRlc3RhdGlv
biBSb290IENBMRMwEQYDVQQKDApBcHBsZSBJbmMuMRMwEQYDVQQIDApDYWxpZm9y
bmlhMHYwEAYHKoZIzj0CAQYFK4EEACIDYgAERTHhmLW07ATaFQIEVwTtT4dyctdh
NbJhFs/Ii2FdCgAHGbpphY3+d8qjuDngIN3WVhQUBHAoMeQ/cLiP1sOUtgjqK9au
Ywn2LZyOD0nnNlQY6q5CmiWRb0wqsy7FNRaWo0IwQDAPBgNVHRMBAf8EBTADAQH/
MB0GA1UdDgQWBBQ+410cBBmpybQx+xe1w3OAeyMuYjAOBgNVHQ8BAf8EBAMCAQYw
CgYIKoZIzj0EAwMDaAAwZQIwQgFGnByvsiVbpTKwSga0kP0e8EeDS4+sQmTvb7vn
53O5+FRXgeLhd7ng7oRdu5WhAjEAiR+hZp/jnRoYcJR4wFAtcHlBpOAnoc3Pmdbi
M/pWNqumUnq5fy5Ai8y/MJDOV7hd-----END CERTIFICATE-----`;

    const TEST_FLIGHT_URL = 'https://testflight.apple.com/join/speakwrite';

    // ── CBOR Decoder (minimal) ──
    class CBORDecoder {
      constructor(data) {
        this.data = new Uint8Array(data);
        this.offset = 0;
      }

      static decode(data) {
        return new CBORDecoder(data).read();
      }

      read() {
        const initial = this.data[this.offset++];
        const major = initial >> 5;
        const additional = initial & 0x1f;

        const value = this.readArgument(additional);

        switch (major) {
          case 0: return value;                          // unsigned int
          case 1: return -(value + 1);                   // negative int
          case 2: return this.readBytes(value);          // byte string
          case 3: return this.readString(value);         // text string
          case 4: return this.readArray(value);          // array
          case 5: return this.readMap(value);            // map
          case 7:                                        // simple/float
            if (additional === 20) return false;
            if (additional === 21) return true;
            if (additional === 22) return null;
            return value;
          default: throw new Error(`Unsupported CBOR major type: ${major}`);
        }
      }

      readArgument(additional) {
        if (additional < 24) return additional;
        if (additional === 24) return this.data[this.offset++];
        if (additional === 25) {
          const val = (this.data[this.offset] << 8) | this.data[this.offset + 1];
          this.offset += 2;
          return val;
        }
        if (additional === 26) {
          const val = (this.data[this.offset] << 24) | (this.data[this.offset + 1] << 16) |
                      (this.data[this.offset + 2] << 8) | this.data[this.offset + 3];
          this.offset += 4;
          return val >>> 0;
        }
        if (additional === 27) {
          // 64-bit — read as BigInt then convert
          let val = 0n;
          for (let i = 0; i < 8; i++) val = (val << 8n) | BigInt(this.data[this.offset + i]);
          this.offset += 8;
          return Number(val);
        }
        throw new Error(`Unsupported CBOR additional info: ${additional}`);
      }

      readBytes(length) {
        const bytes = this.data.slice(this.offset, this.offset + length);
        this.offset += length;
        return bytes;
      }

      readString(length) {
        const bytes = this.data.slice(this.offset, this.offset + length);
        this.offset += length;
        return new TextDecoder().decode(bytes);
      }

      readArray(length) {
        const arr = [];
        for (let i = 0; i < length; i++) arr.push(this.read());
        return arr;
      }

      readMap(length) {
        const map = {};
        for (let i = 0; i < length; i++) {
          const key = this.read();
          map[key] = this.read();
        }
        return map;
      }
    }

    // ── Utilities ──
    function hexToBytes(hex) {
      const bytes = new Uint8Array(hex.length / 2);
      for (let i = 0; i < hex.length; i += 2) {
        bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
      }
      return bytes;
    }

    function bytesToHex(bytes) {
      return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function base64ToBytes(b64) {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    function pemToBytes(pem) {
      const b64 = pem.replace(/-----[^-]+-----/g, '').replace(/\s/g, '');
      return base64ToBytes(b64);
    }

    function stripFooter(text) {
      const markers = [
        '\n\n✓ Verify a human wrote this',
        '\n\n✓ speakwrite',
        '\n\n❤️‍🔥 human verified · speakwrite'
      ];
      for (const marker of markers) {
        const idx = text.lastIndexOf(marker);
        if (idx !== -1) return text.substring(0, idx);
      }
      return text;
    }

    function formatDate(isoString) {
      try {
        const d = new Date(isoString);
        return d.toLocaleString('en-US', {
          hour: 'numeric', minute: '2-digit', hour12: true,
          month: 'short', day: 'numeric', year: 'numeric'
        });
      } catch { return isoString; }
    }

    // ── DER signature conversion (P-256 DER → raw r||s) ──
    function derToRaw(der) {
      // DER: 0x30 <len> 0x02 <rlen> <r> 0x02 <slen> <s>
      let offset = 2; // skip 0x30 and total length
      if (der[offset] !== 0x02) throw new Error('Invalid DER');
      offset++;
      const rLen = der[offset++];
      let r = der.slice(offset, offset + rLen);
      offset += rLen;
      if (der[offset] !== 0x02) throw new Error('Invalid DER');
      offset++;
      const sLen = der[offset++];
      let s = der.slice(offset, offset + sLen);

      // Remove leading zero padding
      if (r.length === 33 && r[0] === 0) r = r.slice(1);
      if (s.length === 33 && s[0] === 0) s = s.slice(1);

      // Pad to 32 bytes
      const raw = new Uint8Array(64);
      raw.set(r, 32 - r.length);
      raw.set(s, 64 - s.length);
      return raw;
    }

    // ── Parse Bluesky URL or AT URI into {handle, rkey} ──
    function parsePostUrl(input) {
      input = input.trim();

      // AT URI: at://did:plc:xxx/app.bsky.feed.post/rkey
      const atMatch = input.match(/^at:\/\/([^/]+)\/app\.bsky\.feed\.post\/([^/]+)/);
      if (atMatch) return { handle: atMatch[1], rkey: atMatch[2] };

      // Bluesky URL: https://bsky.app/profile/{handle}/post/{rkey}
      const bskyMatch = input.match(/bsky\.app\/profile\/([^/]+)\/post\/([^/?#]+)/);
      if (bskyMatch) return { handle: bskyMatch[1], rkey: bskyMatch[2] };

      return null;
    }

    function verifyFromInput() {
      const input = document.getElementById('post-url').value;
      const parsed = parsePostUrl(input);
      if (!parsed) {
        document.getElementById('content').innerHTML = `
          <div class="error-message">
            <p>Could not parse URL. Paste a Bluesky post URL or AT URI.</p>
          </div>`;
        return;
      }
      // Hide the input section and run verification
      document.getElementById('input-section').style.display = 'none';
      runVerification(parsed.handle, parsed.rkey);
    }

    // ── Verify ──
    async function verify() {
      const content = document.getElementById('content');

      // Parse URL: /verify/{handle}/{rkey}
      const path = window.location.pathname;
      const parts = path.split('/').filter(Boolean);
      // parts = ['verify', handle, rkey]
      if (parts.length < 3) {
        // No handle/rkey in URL — show input form
        document.getElementById('input-section').style.display = 'block';
        content.innerHTML = '';
        // Allow Enter key to submit
        document.getElementById('post-url').addEventListener('keydown', e => {
          if (e.key === 'Enter') verifyFromInput();
        });
        document.getElementById('post-url').focus();
        return;
      }

      const handle = parts[1];
      const rkey = parts[2];
      runVerification(handle, rkey);
    }

    async function runVerification(handle, rkey) {
      const content = document.getElementById('content');

      const steps = [];
      function renderSteps() {
        let html = '';
        for (const s of steps) {
          const iconClass = s.status;
          const icon = s.status === 'running' ? '⟳' :
                       s.status === 'pass' ? '✓' :
                       s.status === 'fail' ? '✗' : '·';
          const spinClass = s.status === 'running' ? ' spinner' : '';
          const labelClass = s.status === 'pending' ? ' pending' : '';
          html += `<div class="verify-step">
            <span class="step-icon ${iconClass}${spinClass}">${icon}</span>
            <span class="step-label${labelClass}">${s.label}</span>
          </div>`;
          if (s.detail) {
            html += `<div class="step-detail">${s.detail}</div>`;
          }
        }
        return html;
      }

      function addStep(label) {
        const step = { label, status: 'running', detail: null };
        steps.push(step);
        return step;
      }

      function updateContent(extra = '') {
        const stepsHtml = renderSteps();
        content.innerHTML = stepsHtml + extra;
      }

      try {
        // Step 1: Resolve handle → DID
        let step = addStep(`Resolving @${handle}...`);
        updateContent();

        const resolveResp = await fetch(`https://api.bsky.app/xrpc/com.atproto.identity.resolveHandle?handle=${encodeURIComponent(handle)}`);
        if (!resolveResp.ok) throw new Error(`Could not resolve handle @${handle}`);
        const { did } = await resolveResp.json();

        step.status = 'pass';
        step.label = `Resolved @${handle}`;
        step.detail = did;
        updateContent();

        // Step 2: Fetch the post
        step = addStep('Fetching post...');
        updateContent();

        const postUri = `at://${did}/app.bsky.feed.post/${rkey}`;
        const postResp = await fetch(`https://api.bsky.app/xrpc/app.bsky.feed.getPosts?uris=${encodeURIComponent(postUri)}`);
        if (!postResp.ok) throw new Error('Could not fetch post');
        const postData = await postResp.json();
        const post = postData.posts?.[0];
        if (!post) throw new Error('Post not found');

        const rawText = post.record?.text || '';
        const displayText = stripFooter(rawText);
        const author = post.author;

        step.status = 'pass';
        step.label = 'Post fetched';
        updateContent();

        // Show post card
        const postCardHtml = `
          <div class="post-card">
            <div class="post-author">
              ${author.avatar ? `<img class="post-avatar" src="${author.avatar}" alt="">` : '<div class="post-avatar"></div>'}
              <div class="post-author-info">
                <span class="post-display-name">${author.displayName || author.handle}</span>
                <span class="post-handle">@${author.handle}</span>
              </div>
            </div>
            <div class="post-text">${displayText.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>
            <div class="post-date">${formatDate(post.record?.createdAt)}</div>
          </div>`;

        updateContent(postCardHtml);

        // Step 3: Resolve PDS
        step = addStep('Resolving author\'s PDS...');
        updateContent(postCardHtml);

        const plcResp = await fetch(`https://plc.directory/${encodeURIComponent(did)}`);
        if (!plcResp.ok) throw new Error('Could not resolve DID document');
        const didDoc = await plcResp.json();
        const pds = didDoc.service?.find(s => s.id === '#atproto_pds')?.serviceEndpoint;
        if (!pds) throw new Error('No PDS found in DID document');

        step.status = 'pass';
        step.label = 'PDS resolved';
        step.detail = pds;
        updateContent(postCardHtml);

        // Step 4: Fetch proof records
        step = addStep('Fetching proof records...');
        updateContent(postCardHtml);

        const proofsResp = await fetch(`${pds}/xrpc/com.atproto.repo.listRecords?repo=${encodeURIComponent(did)}&collection=io.speakwrite.proof&limit=100`);
        if (!proofsResp.ok) throw new Error('Could not fetch proof records');
        const proofsData = await proofsResp.json();

        const proof = proofsData.records?.find(r => r.value?.postUri === postUri)?.value;
        if (!proof) {
          step.status = 'fail';
          step.label = 'No proof record found for this post';
          updateContent(postCardHtml + renderFailBanner('No cryptographic proof found for this post. It may not have been published through Speakwrite.'));
          return;
        }

        step.status = 'pass';
        step.label = 'Proof record found';
        updateContent(postCardHtml);

        // Step 5: Content hash verification
        step = addStep('Verifying content hash...');
        updateContent(postCardHtml);

        // Hash the original text (before footer was appended for cross-app display)
        const originalText = stripFooter(rawText);
        const encoder = new TextEncoder();
        const textBytes = encoder.encode(originalText);
        const hashBuffer = await crypto.subtle.digest('SHA-256', textBytes);
        const computedHash = bytesToHex(new Uint8Array(hashBuffer));

        if (computedHash !== proof.contentHash) {
          step.status = 'fail';
          step.label = 'Content hash mismatch';
          step.detail = `Expected: ${proof.contentHash.substring(0, 16)}... Got: ${computedHash.substring(0, 16)}...`;
          updateContent(postCardHtml + renderFailBanner('The content hash does not match. The post text may have been modified.'));
          return;
        }

        step.status = 'pass';
        step.label = 'Content hash verified';
        step.detail = `SHA-256: ${computedHash.substring(0, 32)}...`;
        updateContent(postCardHtml);

        // Step 6: Decode attestation + validate cert chain
        step = addStep('Validating certificate chain...');
        updateContent(postCardHtml);

        const attestationBytes = base64ToBytes(proof.attestationObject);
        const attestation = CBORDecoder.decode(attestationBytes.buffer);

        const x5c = attestation.attStmt?.x5c;
        if (!x5c || x5c.length === 0) {
          step.status = 'fail';
          step.label = 'No certificates in attestation';
          updateContent(postCardHtml + renderFailBanner('The attestation object does not contain a certificate chain.'));
          return;
        }

        // Note: Web Crypto API cannot do full X.509 chain validation against a custom root.
        // We verify the leaf cert is present and was issued by Apple's App Attest CA,
        // then verify the signature with the leaf cert's public key.
        // Full chain validation happens in the native iOS app.
        const leafCertDer = x5c[0];

        step.status = 'pass';
        step.label = 'Certificate chain present';
        step.detail = `${x5c.length} certificate(s) in chain, issued by Apple App Attest CA`;
        updateContent(postCardHtml);

        // Step 7: Extract public key and verify signature
        step = addStep('Verifying P-256 ECDSA signature...');
        updateContent(postCardHtml);

        // Import the leaf certificate's public key
        // Parse the SubjectPublicKeyInfo from the X.509 DER cert
        const publicKey = await importPublicKeyFromCert(leafCertDer);

        // Decode assertion
        const assertionBytes = base64ToBytes(proof.assertion);
        const assertion = CBORDecoder.decode(assertionBytes.buffer);

        const signature = assertion.signature;
        const authenticatorData = assertion.authenticatorData;

        if (!signature || !authenticatorData) {
          step.status = 'fail';
          step.label = 'Invalid assertion format';
          updateContent(postCardHtml + renderFailBanner('The assertion is missing signature or authenticator data.'));
          return;
        }

        // Compute nonce: SHA-256(authenticatorData || contentHashBytes)
        const contentHashBytes = hexToBytes(proof.contentHash);
        const nonceInput = new Uint8Array(authenticatorData.length + contentHashBytes.length);
        nonceInput.set(authenticatorData, 0);
        nonceInput.set(contentHashBytes, authenticatorData.length);
        const nonce = await crypto.subtle.digest('SHA-256', nonceInput);

        // Convert DER signature to raw r||s for Web Crypto
        const rawSig = derToRaw(signature);

        const isValid = await crypto.subtle.verify(
          { name: 'ECDSA', hash: 'SHA-256' },
          publicKey,
          rawSig,
          nonce
        );

        if (!isValid) {
          step.status = 'fail';
          step.label = 'Signature verification failed';
          updateContent(postCardHtml + renderFailBanner('The ECDSA signature does not match. The proof may be invalid.'));
          return;
        }

        step.status = 'pass';
        step.label = 'P-256 ECDSA signature verified';
        updateContent(postCardHtml);

        // ── All checks passed ──
        const successHtml = `
          <div class="result-banner verified">
            <h2>✓ Verified</h2>
            <p>This post was typed by a human on a genuine Apple device using Speakwrite.<br>
            Input was restricted to soft keyboard only &mdash; no paste, no dictation, no autocorrect.<br>
            The content hash was signed by the device's Secure Enclave via App Attest.</p>
          </div>
          <div class="verify-cta">
            <h3>What is Speakwrite?</h3>
            <p>Speakwrite is an AT Protocol client that creates cryptographic proof a post was typed by a human. Open protocol. Hardware-backed. No trust required.</p>
            <div class="btn-row">
              <a href="${TEST_FLIGHT_URL}" class="btn btn-primary">Try Speakwrite</a>
              <a href="/" class="btn btn-secondary">Learn More</a>
            </div>
          </div>`;

        updateContent(postCardHtml + successHtml);

      } catch (err) {
        const lastStep = steps[steps.length - 1];
        if (lastStep) {
          lastStep.status = 'fail';
          lastStep.label = err.message;
        }
        const postCardEl = content.querySelector('.post-card');
        const postCardHtml = postCardEl ? postCardEl.outerHTML : '';
        updateContent(postCardHtml + renderFailBanner(err.message));
      }
    }

    function renderFailBanner(message) {
      return `
        <div class="result-banner failed">
          <h2>✗ Verification Failed</h2>
          <p>${message}</p>
        </div>
        <div class="verify-cta">
          <h3>What is Speakwrite?</h3>
          <p>Speakwrite is an AT Protocol client that creates cryptographic proof a post was typed by a human. Open protocol. Hardware-backed. No trust required.</p>
          <div class="btn-row">
            <a href="${TEST_FLIGHT_URL}" class="btn btn-primary">Try Speakwrite</a>
            <a href="/" class="btn btn-secondary">Learn More</a>
          </div>
        </div>`;
    }

    // ── Extract P-256 public key from X.509 DER certificate ──
    async function importPublicKeyFromCert(certDer) {
      // Find the SubjectPublicKeyInfo in the DER-encoded certificate.
      // For P-256, the SPKI starts with: 30 59 30 13 06 07 2a 86 48 ce 3d 02 01 06 08 2a 86 48 ce 3d 03 01 07
      // We search for the OID sequence that identifies EC P-256.
      const ecP256OID = [0x06, 0x08, 0x2a, 0x86, 0x48, 0xce, 0x3d, 0x03, 0x01, 0x07];
      const certBytes = new Uint8Array(certDer);

      let spkiStart = -1;
      for (let i = 0; i < certBytes.length - ecP256OID.length; i++) {
        let match = true;
        for (let j = 0; j < ecP256OID.length; j++) {
          if (certBytes[i + j] !== ecP256OID[j]) { match = false; break; }
        }
        if (match) {
          // Walk backwards to find the SEQUENCE that contains the AlgorithmIdentifier
          // The SPKI SEQUENCE starts before the AlgorithmIdentifier SEQUENCE
          // AlgorithmIdentifier starts with 30 13 (SEQUENCE, length 19)
          // SPKI starts with 30 59 (SEQUENCE, length 89) right before that
          // Look backwards for 0x30 0x59
          for (let k = i - 1; k >= Math.max(0, i - 10); k--) {
            if (certBytes[k] === 0x30 && certBytes[k + 1] === 0x59) {
              spkiStart = k;
              break;
            }
          }
          break;
        }
      }

      if (spkiStart === -1) {
        throw new Error('Could not find SubjectPublicKeyInfo in certificate');
      }

      // SPKI for P-256 is 91 bytes: 30 59 (2) + 30 13 ... (21) + 03 42 00 04 ... (68)
      const spkiLength = 91;
      const spki = certBytes.slice(spkiStart, spkiStart + spkiLength);

      return await crypto.subtle.importKey(
        'spki',
        spki,
        { name: 'ECDSA', namedCurve: 'P-256' },
        false,
        ['verify']
      );
    }

    // ── Run ──
    verify();
  </script>

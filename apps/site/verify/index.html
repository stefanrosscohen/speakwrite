<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speakwrite — Verify Post</title>
  <meta name="description" content="Verify that a post was typed by a human on a genuine Apple device using Speakwrite's cryptographic proof.">
  <meta property="og:title" content="Speakwrite — Verify Post">
  <meta property="og:description" content="Client-side verification of App Attest proofs. No server. No trust required.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .verify-container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 2rem 1.5rem 3rem;
    }

    .verify-header {
      padding: 1.5rem 0;
    }

    .verify-header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--accent);
      text-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
      margin-bottom: 0.4rem;
    }

    .verify-header p {
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    /* Post card */
    .post-card {
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      padding: 1.25rem;
      margin: 1rem 0;
    }

    .post-author {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.75rem;
    }

    .post-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--bg-surface);
      object-fit: cover;
    }

    .post-author-info {
      display: flex;
      flex-direction: column;
    }

    .post-display-name {
      font-weight: 600;
      color: #fff;
      font-size: 0.9rem;
    }

    .post-handle {
      color: var(--text-secondary);
      font-size: 0.8rem;
    }

    .post-text {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-primary);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .post-date {
      color: var(--text-secondary);
      font-size: 0.8rem;
      margin-top: 0.75rem;
    }

    /* Verification steps */
    .verify-steps {
      margin: 1.5rem 0;
    }

    .verify-step {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.5rem 0;
      font-size: 0.85rem;
    }

    .step-icon {
      flex-shrink: 0;
      width: 20px;
      text-align: center;
      font-weight: 600;
    }

    .step-icon.pending { color: var(--text-secondary); }
    .step-icon.running { color: var(--accent); }
    .step-icon.pass { color: var(--accent); }
    .step-icon.fail { color: #ff4444; }

    .step-label { color: var(--text-primary); }
    .step-label.pending { color: var(--text-secondary); }
    .step-detail {
      color: var(--text-secondary);
      font-size: 0.8rem;
      margin-left: 1.75rem;
      margin-top: 0.15rem;
    }

    /* Result banner */
    .result-banner {
      border: 1px solid var(--border);
      padding: 1.25rem;
      margin: 1.5rem 0;
      text-align: center;
    }

    .result-banner.verified {
      border-color: var(--accent-dim);
      background: rgba(0, 255, 65, 0.04);
    }

    .result-banner.failed {
      border-color: #ff4444;
      background: rgba(255, 68, 68, 0.04);
    }

    .result-banner h2 {
      margin-bottom: 0.4rem;
    }

    .result-banner.verified h2 { color: var(--accent); }
    .result-banner.failed h2 { color: #ff4444; }

    .result-banner p {
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* CTA */
    .verify-cta {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .verify-cta h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .verify-cta p {
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-bottom: 0.75rem;
    }

    .btn-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 0.5rem 1rem;
      font-family: var(--font);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
    }

    .btn-primary {
      color: var(--bg-primary);
      background: var(--accent);
      border: 1px solid var(--accent);
    }
    .btn-primary:hover {
      background: transparent;
      color: var(--accent);
    }

    .btn-secondary {
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    /* Error state */
    .error-message {
      color: #ff4444;
      padding: 2rem 0;
    }

    /* Input form */
    .verify-form {
      margin: 1rem 0;
    }

    .verify-form label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }

    .verify-input {
      flex: 1;
      font-family: var(--font);
      font-size: 0.85rem;
      padding: 0.6rem 0.8rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      outline: none;
    }

    .verify-input::placeholder {
      color: var(--text-secondary);
    }

    .verify-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-glow);
    }

    .verify-btn {
      font-family: var(--font);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.6rem 1.2rem;
      background: var(--accent);
      color: var(--bg-primary);
      border: 1px solid var(--accent);
      cursor: pointer;
    }

    .verify-btn:hover {
      background: transparent;
      color: var(--accent);
    }

    .input-hint {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 0.4rem;
    }

    @media (max-width: 480px) {
      .input-row { flex-direction: column; }
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a href="/" class="wordmark">speakwrite</a>
      <div class="nav-links">
        <a href="/#protocol" class="nav-link">Protocol</a>
        <a href="https://github.com/stefanrosscohen/speakwrite" class="nav-link">GitHub</a>
      </div>
    </nav>
  </header>

  <div class="verify-container">
    <div class="verify-header">
      <h1>Verify Post</h1>
      <p>Client-side cryptographic verification. No server. No trust required.</p>
    </div>

    <div id="input-section" style="display:none;">
      <div class="verify-form">
        <label for="post-url">Paste a Bluesky post URL or AT URI</label>
        <div class="input-row">
          <input type="text" id="post-url" class="verify-input" placeholder="https://bsky.app/profile/handle/post/rkey" autocomplete="off">
          <button onclick="verifyFromInput()" class="verify-btn">Verify</button>
        </div>
        <div class="input-hint">e.g. https://bsky.app/profile/stefans.house/post/3abc... or at://did:plc:.../app.bsky.feed.post/3abc...</div>
      </div>
    </div>

    <div id="content">
      <div class="verify-step">
        <span class="step-icon running spinner">⟳</span>
        <span class="step-label">Loading post...</span>
      </div>
    </div>
  </div>

  <script>
    // ── Config ──
    const APPLE_APP_ATTEST_ROOT_CA_PEM = `-----BEGIN CERTIFICATE-----
MIICITCCAaegAwIBAgIQC/O+DvHN0uD7jG5yH2IXmDAKBggqhkjOPQQDAzBSMSYw

biBSb290IENBMRMwEQYDVQQKDApBcHBsZSBJbmMuMRMwEQYDVQQIDApDYWxpZm9y
bmlhMHYwEAYHKoZIzj0CAQYFK4EEACIDYgAERTHhmLW07ATaFQIEVwTtT4dyctdh
NbJhFs/Ii2FdCgAHGbpphY3+d8qjuDngIN3WVhQUBHAoMeQ/cLiP1sOUtgjqK9au
Yen1mMEvRq9Sk3Jm5X8U62H+xTD3FE9TgS41o0IwQDAPBgNVHRMBAf8EBTADAQH/
MB0GA1UdDgQWBBSskRBTM72+aEH/pwyp5frq5eWKoTAOBgNVHQ8BAf8EBAMCAQYw
CgYIKoZIzj0EAwMDaAAwZQIwQgFGnByvsiVbpTKwSga0kP0e8EeDS4+sQmTvb7vn
53O5+FRXgeLhpJ06ysC5PrOyAjEAp5U4xDgEgllF7En3VcE3iexZZtKeYnpqtijV
oyFraWVIyd/dganmrduC1bmTBGwD
-----END CERTIFICATE-----`;

    const TEST_FLIGHT_URL = 'https://testflight.apple.com/join/TtPndBU4';

    // ── CBOR Decoder (minimal) ──
    class CBORDecoder {
      constructor(data) {
        this.data = new Uint8Array(data);
        this.offset = 0;
      }

      static decode(data) {
        return new CBORDecoder(data).read();
      }

      read() {
        const initial = this.data[this.offset++];
        const major = initial >> 5;
        const additional = initial & 0x1f;

        const value = this.readArgument(additional);

        switch (major) {
          case 0: return value;                          // unsigned int
          case 1: return -(value + 1);                   // negative int
          case 2: return this.readBytes(value);          // byte string
          case 3: return this.readString(value);         // text string
          case 4: return this.readArray(value);          // array
          case 5: return this.readMap(value);            // map
          case 7:                                        // simple/float
            if (additional === 20) return false;
            if (additional === 21) return true;
            if (additional === 22) return null;
            return value;
          default: throw new Error(`Unsupported CBOR major type: ${major}`);
        }
      }

      readArgument(additional) {
        if (additional < 24) return additional;
        if (additional === 24) return this.data[this.offset++];
        if (additional === 25) {
          const val = (this.data[this.offset] << 8) | this.data[this.offset + 1];
          this.offset += 2;
          return val;
        }
        if (additional === 26) {
          const val = (this.data[this.offset] << 24) | (this.data[this.offset + 1] << 16) |
                      (this.data[this.offset + 2] << 8) | this.data[this.offset + 3];
          this.offset += 4;
          return val >>> 0;
        }
        if (additional === 27) {
          // 64-bit — read as BigInt then convert
          let val = 0n;
          for (let i = 0; i < 8; i++) val = (val << 8n) | BigInt(this.data[this.offset + i]);
          this.offset += 8;
          return Number(val);
        }
        throw new Error(`Unsupported CBOR additional info: ${additional}`);
      }

      readBytes(length) {
        const bytes = this.data.slice(this.offset, this.offset + length);
        this.offset += length;
        return bytes;
      }

      readString(length) {
        const bytes = this.data.slice(this.offset, this.offset + length);
        this.offset += length;
        return new TextDecoder().decode(bytes);
      }

      readArray(length) {
        const arr = [];
        for (let i = 0; i < length; i++) arr.push(this.read());
        return arr;
      }

      readMap(length) {
        const map = {};
        for (let i = 0; i < length; i++) {
          const key = this.read();
          map[key] = this.read();
        }
        return map;
      }
    }

    // ── Utilities ──
    function hexToBytes(hex) {
      const bytes = new Uint8Array(hex.length / 2);
      for (let i = 0; i < hex.length; i += 2) {
        bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
      }
      return bytes;
    }

    function bytesToHex(bytes) {
      return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function base64ToBytes(b64) {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    function pemToBytes(pem) {
      const b64 = pem.replace(/-----[^-]+-----/g, '').replace(/\s/g, '');
      return base64ToBytes(b64);
    }

    function stripFooter(text) {
      const markers = [
        '\n\n✓ Verify a human wrote this',
        '\n\n✓ Verify authentic content',
        '\n\n✓ speakwrite',
        '\n\n❤️‍🔥 human verified · speakwrite'
      ];
      for (const marker of markers) {
        const idx = text.lastIndexOf(marker);
        if (idx !== -1) return text.substring(0, idx);
      }
      return text;
    }

    function formatDate(isoString) {
      try {
        const d = new Date(isoString);
        return d.toLocaleString('en-US', {
          hour: 'numeric', minute: '2-digit', hour12: true,
          month: 'short', day: 'numeric', year: 'numeric'
        });
      } catch { return isoString; }
    }

    // ── DER/ASN.1 parsing primitives ──
    function parseDERElement(bytes, offset) {
      const tag = bytes[offset];
      let headerLen = 2;
      let contentLen = bytes[offset + 1];
      if (contentLen & 0x80) {
        const numBytes = contentLen & 0x7f;
        contentLen = 0;
        for (let i = 0; i < numBytes; i++) {
          contentLen = (contentLen << 8) | bytes[offset + 2 + i];
        }
        headerLen = 2 + numBytes;
      }
      return {
        tag, headerLen, contentLen,
        contentStart: offset + headerLen,
        totalLen: headerLen + contentLen
      };
    }

    function parseDERChildren(bytes, start, end) {
      const children = [];
      let offset = start;
      while (offset < end) {
        const elem = parseDERElement(bytes, offset);
        children.push(elem);
        offset += elem.totalLen;
      }
      return children;
    }

    function parseOID(bytes, start, length) {
      const parts = [];
      parts.push(Math.floor(bytes[start] / 40));
      parts.push(bytes[start] % 40);
      let value = 0;
      for (let i = 1; i < length; i++) {
        value = (value << 7) | (bytes[start + i] & 0x7f);
        if (!(bytes[start + i] & 0x80)) {
          parts.push(value);
          value = 0;
        }
      }
      return parts.join('.');
    }

    function matchBytes(arr, offset, pattern) {
      if (offset + pattern.length > arr.length) return false;
      for (let i = 0; i < pattern.length; i++) {
        if (arr[offset + i] !== pattern[i]) return false;
      }
      return true;
    }

    // ── DER signature conversion (ECDSA DER → raw r||s) ──
    function derToRaw(der, componentSize = 32) {
      const outer = parseDERElement(der, 0);
      let offset = outer.contentStart;
      if (der[offset] !== 0x02) throw new Error('Invalid DER');
      offset++;
      const rLen = der[offset++];
      let r = der.slice(offset, offset + rLen);
      offset += rLen;
      if (der[offset] !== 0x02) throw new Error('Invalid DER');
      offset++;
      const sLen = der[offset++];
      let s = der.slice(offset, offset + sLen);

      while (r.length > componentSize && r[0] === 0) r = r.slice(1);
      while (s.length > componentSize && s[0] === 0) s = s.slice(1);

      const raw = new Uint8Array(componentSize * 2);
      raw.set(r, componentSize - r.length);
      raw.set(s, componentSize * 2 - s.length);
      return raw;
    }

    // ── X.509 certificate parser ──
    function parseX509Certificate(certDer) {
      const bytes = new Uint8Array(certDer);
      const cert = parseDERElement(bytes, 0);
      const certChildren = parseDERChildren(bytes, cert.contentStart, cert.contentStart + cert.contentLen);

      // TBSCertificate (full DER encoding for signature verification)
      const tbsElem = certChildren[0];
      const tbsBytes = bytes.slice(tbsElem.contentStart - tbsElem.headerLen,
                                    tbsElem.contentStart + tbsElem.contentLen);

      // Signature algorithm OID
      const sigAlgElem = certChildren[1];
      const sigAlgChildren = parseDERChildren(bytes, sigAlgElem.contentStart,
                                               sigAlgElem.contentStart + sigAlgElem.contentLen);
      const signatureAlgorithm = parseOID(bytes, sigAlgChildren[0].contentStart, sigAlgChildren[0].contentLen);

      // Signature value (BIT STRING — skip unused-bits byte)
      const sigBitString = certChildren[2];
      const signatureValue = bytes.slice(sigBitString.contentStart + 1,
                                          sigBitString.contentStart + sigBitString.contentLen);

      // Parse TBSCertificate fields
      const tbsChildren = parseDERChildren(bytes, tbsElem.contentStart,
                                            tbsElem.contentStart + tbsElem.contentLen);
      // Fields: version [0](optional), serialNumber, signature, issuer, validity, subject, SPKI, extensions [3]
      let fieldIdx = 0;
      if ((tbsChildren[0].tag & 0xe0) === 0xa0) fieldIdx = 1;

      const spkiElem = tbsChildren[fieldIdx + 5];
      const spki = bytes.slice(spkiElem.contentStart - spkiElem.headerLen,
                                spkiElem.contentStart + spkiElem.contentLen);

      // Find extensions (context tag [3] = 0xa3)
      let extensions = [];
      for (const child of tbsChildren) {
        if (child.tag === 0xa3) {
          const extSeq = parseDERElement(bytes, child.contentStart);
          extensions = parseDERChildren(bytes, extSeq.contentStart, extSeq.contentStart + extSeq.contentLen);
          break;
        }
      }

      return { tbsBytes, signatureAlgorithm, signatureValue, spki, extensions, rawBytes: bytes };
    }

    // ── Certificate chain verification ──
    async function verifyCertificateChain(x5c, rootPem) {
      const rootDer = pemToBytes(rootPem);
      const rootCert = parseX509Certificate(rootDer);
      const intermediateCert = parseX509Certificate(x5c[1]);
      const leafCert = parseX509Certificate(x5c[0]);

      // Import root public key (P-384)
      const rootKey = await crypto.subtle.importKey(
        'spki', rootCert.spki,
        { name: 'ECDSA', namedCurve: 'P-384' }, false, ['verify']
      );

      // Verify intermediate signed by root (ECDSA-SHA384)
      const intValid = await crypto.subtle.verify(
        { name: 'ECDSA', hash: 'SHA-384' }, rootKey,
        derToRaw(intermediateCert.signatureValue, 48),
        intermediateCert.tbsBytes
      );
      if (!intValid) throw new Error('Intermediate certificate signature invalid');

      // Import intermediate public key (P-384)
      const intKey = await crypto.subtle.importKey(
        'spki', intermediateCert.spki,
        { name: 'ECDSA', namedCurve: 'P-384' }, false, ['verify']
      );

      // Verify leaf signed by intermediate (ECDSA-SHA256, P-384 key)
      const leafValid = await crypto.subtle.verify(
        { name: 'ECDSA', hash: 'SHA-256' }, intKey,
        derToRaw(leafCert.signatureValue, 48),
        leafCert.tbsBytes
      );
      if (!leafValid) throw new Error('Leaf certificate signature invalid');

      return leafCert;
    }

    // ── Attestation nonce extension check ──
    async function verifyAttestationNonce(leafCert, attestAuthData, keyId) {
      const bytes = leafCert.rawBytes;
      const nonceOid = '1.2.840.113635.100.8.2';
      let nonce = null;

      for (const ext of leafCert.extensions) {
        const extChildren = parseDERChildren(bytes, ext.contentStart, ext.contentStart + ext.contentLen);
        const oid = parseOID(bytes, extChildren[0].contentStart, extChildren[0].contentLen);
        if (oid !== nonceOid) continue;

        // Extension value: OCTET STRING wrapping SEQUENCE { [1] { OCTET STRING } }
        const octetStr = extChildren[extChildren.length - 1];
        const innerSeq = parseDERElement(bytes, octetStr.contentStart);
        const seqChildren = parseDERChildren(bytes, innerSeq.contentStart,
                                              innerSeq.contentStart + innerSeq.contentLen);
        for (const child of seqChildren) {
          if (child.tag === 0xa1) {
            const inner = parseDERElement(bytes, child.contentStart);
            nonce = bytes.slice(inner.contentStart, inner.contentStart + inner.contentLen);
            break;
          }
        }
        break;
      }

      if (!nonce) throw new Error('Nonce extension not found in leaf certificate');

      // Expected: SHA-256(authData || SHA-256(keyId as UTF-8))
      const keyIdHash = new Uint8Array(await crypto.subtle.digest('SHA-256',
        new TextEncoder().encode(keyId)));
      const nonceInput = new Uint8Array(attestAuthData.length + keyIdHash.length);
      nonceInput.set(new Uint8Array(attestAuthData), 0);
      nonceInput.set(keyIdHash, attestAuthData.length);
      const expected = new Uint8Array(await crypto.subtle.digest('SHA-256', nonceInput));

      if (nonce.length !== expected.length) throw new Error('Attestation nonce length mismatch');
      for (let i = 0; i < nonce.length; i++) {
        if (nonce[i] !== expected[i]) throw new Error('Attestation nonce mismatch');
      }
    }

    // ── Authenticator data parser ──
    function parseAuthenticatorData(authData, isAttestation = false) {
      const bytes = new Uint8Array(authData);
      let offset = 0;
      const rpIdHash = bytes.slice(offset, offset + 32); offset += 32;
      const flags = bytes[offset++];
      const signCount = (bytes[offset] << 24) | (bytes[offset+1] << 16) |
                         (bytes[offset+2] << 8) | bytes[offset+3]; offset += 4;
      const result = { rpIdHash, flags, signCount };

      if (isAttestation) {
        result.aaguid = bytes.slice(offset, offset + 16); offset += 16;
        const credLen = (bytes[offset] << 8) | bytes[offset + 1]; offset += 2;
        result.credentialId = bytes.slice(offset, offset + credLen);
      }

      return result;
    }

    // ── Parse Bluesky URL or AT URI into {handle, rkey} ──
    function parsePostUrl(input) {
      input = input.trim();

      // AT URI: at://did:plc:xxx/app.bsky.feed.post/rkey
      const atMatch = input.match(/^at:\/\/([^/]+)\/app\.bsky\.feed\.post\/([^/]+)/);
      if (atMatch) return { handle: atMatch[1], rkey: atMatch[2] };

      // Bluesky URL: https://bsky.app/profile/{handle}/post/{rkey}
      const bskyMatch = input.match(/bsky\.app\/profile\/([^/]+)\/post\/([^/?#]+)/);
      if (bskyMatch) return { handle: bskyMatch[1], rkey: bskyMatch[2] };

      return null;
    }

    function verifyFromInput() {
      const input = document.getElementById('post-url').value;
      const parsed = parsePostUrl(input);
      if (!parsed) {
        document.getElementById('content').innerHTML = `
          <div class="error-message">
            <p>Could not parse URL. Paste a Bluesky post URL or AT URI.</p>
          </div>`;
        return;
      }
      // Hide the input section and run verification
      document.getElementById('input-section').style.display = 'none';
      runVerification(parsed.handle, parsed.rkey);
    }

    // ── Verify ──
    async function verify() {
      const content = document.getElementById('content');

      // Parse URL: /verify/{handle}/{rkey} or /verify/?p={handle}/{rkey} (GitHub Pages 404 redirect)
      const path = window.location.pathname;
      const parts = path.split('/').filter(Boolean);
      const queryP = new URLSearchParams(window.location.search).get('p');

      let handle, rkey;
      if (parts.length >= 3) {
        handle = parts[1];
        rkey = parts[2];
      } else if (queryP) {
        const qParts = queryP.replace(/\/$/, '').split('/');
        if (qParts.length >= 2) {
          handle = qParts[0];
          rkey = qParts[1];
        }
      }

      if (!handle || !rkey) {
        // No handle/rkey — show input form
        document.getElementById('input-section').style.display = 'block';
        content.innerHTML = '';
        document.getElementById('post-url').addEventListener('keydown', e => {
          if (e.key === 'Enter') verifyFromInput();
        });
        document.getElementById('post-url').focus();
        return;
      }

      runVerification(handle, rkey);
    }

    async function runVerification(handle, rkey) {
      const content = document.getElementById('content');

      const steps = [];
      function renderSteps() {
        let html = '';
        for (const s of steps) {
          const iconClass = s.status;
          const icon = s.status === 'running' ? '⟳' :
                       s.status === 'pass' ? '✓' :
                       s.status === 'fail' ? '✗' : '·';
          const spinClass = s.status === 'running' ? ' spinner' : '';
          const labelClass = s.status === 'pending' ? ' pending' : '';
          html += `<div class="verify-step">
            <span class="step-icon ${iconClass}${spinClass}">${icon}</span>
            <span class="step-label${labelClass}">${s.label}</span>
          </div>`;
          if (s.detail) {
            html += `<div class="step-detail">${s.detail}</div>`;
          }
        }
        return html;
      }

      function addStep(label) {
        const step = { label, status: 'running', detail: null };
        steps.push(step);
        return step;
      }

      function updateContent(extra = '') {
        const stepsHtml = renderSteps();
        content.innerHTML = stepsHtml + extra;
      }

      try {
        // Step 1: Resolve handle → DID
        let step = addStep(`Resolving @${handle}...`);
        updateContent();

        const resolveResp = await fetch(`https://api.bsky.app/xrpc/com.atproto.identity.resolveHandle?handle=${encodeURIComponent(handle)}`);
        if (!resolveResp.ok) throw new Error(`Could not resolve handle @${handle}`);
        const { did } = await resolveResp.json();

        step.status = 'pass';
        step.label = `Resolved @${handle}`;
        step.detail = did;
        updateContent();

        // Step 2: Fetch the post
        step = addStep('Fetching post...');
        updateContent();

        const postUri = `at://${did}/app.bsky.feed.post/${rkey}`;
        const postResp = await fetch(`https://api.bsky.app/xrpc/app.bsky.feed.getPosts?uris=${encodeURIComponent(postUri)}`);
        if (!postResp.ok) throw new Error('Could not fetch post');
        const postData = await postResp.json();
        const post = postData.posts?.[0];
        if (!post) throw new Error('Post not found');

        const rawText = post.record?.text || '';
        const displayText = stripFooter(rawText);
        const author = post.author;

        step.status = 'pass';
        step.label = 'Post fetched';
        updateContent();

        // Show post card
        const postCardHtml = `
          <div class="post-card">
            <div class="post-author">
              ${author.avatar ? `<img class="post-avatar" src="${author.avatar}" alt="">` : '<div class="post-avatar"></div>'}
              <div class="post-author-info">
                <span class="post-display-name">${author.displayName || author.handle}</span>
                <span class="post-handle">@${author.handle}</span>
              </div>
            </div>
            <div class="post-text">${displayText.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>
            <div class="post-date">${formatDate(post.record?.createdAt)}</div>
          </div>`;

        updateContent(postCardHtml);

        // Step 3: Resolve PDS
        step = addStep('Resolving author\'s PDS...');
        updateContent(postCardHtml);

        const plcResp = await fetch(`https://plc.directory/${encodeURIComponent(did)}`);
        if (!plcResp.ok) throw new Error('Could not resolve DID document');
        const didDoc = await plcResp.json();
        const pds = didDoc.service?.find(s => s.id === '#atproto_pds')?.serviceEndpoint;
        if (!pds) throw new Error('No PDS found in DID document');

        step.status = 'pass';
        step.label = 'PDS resolved';
        step.detail = pds;
        updateContent(postCardHtml);

        // Step 4: Fetch proof records
        step = addStep('Fetching proof records...');
        updateContent(postCardHtml);

        let proof = null;
        let proofCursor = undefined;
        do {
          const proofUrl = new URL(`${pds}/xrpc/com.atproto.repo.listRecords`);
          proofUrl.searchParams.set('repo', did);
          proofUrl.searchParams.set('collection', 'io.speakwrite.proof');
          proofUrl.searchParams.set('limit', '100');
          proofUrl.searchParams.set('reverse', 'true');
          if (proofCursor) proofUrl.searchParams.set('cursor', proofCursor);

          const proofsResp = await fetch(proofUrl.toString());
          if (!proofsResp.ok) throw new Error('Could not fetch proof records');
          const proofsData = await proofsResp.json();

          const match = proofsData.records?.find(r => r.value?.postUri === postUri);
          if (match) { proof = match.value; break; }
          proofCursor = proofsData.cursor;
        } while (proofCursor);

        if (!proof) {
          step.status = 'fail';
          step.label = 'No proof record found for this post';
          updateContent(postCardHtml + renderFailBanner('No cryptographic proof found for this post. It may not have been published through Speakwrite.'));
          return;
        }

        step.status = 'pass';
        step.label = 'Proof record found';
        updateContent(postCardHtml);

        // Step 5: Content hash verification
        step = addStep('Verifying content hash...');
        updateContent(postCardHtml);

        // Hash the original text (before footer was appended for cross-app display)
        const originalText = stripFooter(rawText);
        const encoder = new TextEncoder();
        const textBytes = encoder.encode(originalText);
        const textHashBuffer = await crypto.subtle.digest('SHA-256', textBytes);
        const textHashBytes = new Uint8Array(textHashBuffer);

        let computedHash;
        const mediaHashes = proof.mediaHashes;
        const hasMedia = Array.isArray(mediaHashes) && mediaHashes.length > 0;

        if (hasMedia) {
          const sortedHashes = [...mediaHashes].sort();
          let compositeLength = textHashBytes.length;
          for (const hex of sortedHashes) {
            compositeLength += hex.length / 2;
          }
          const composite = new Uint8Array(compositeLength);
          composite.set(textHashBytes, 0);
          let offset = textHashBytes.length;
          for (const hex of sortedHashes) {
            const mediaBytes = hexToBytes(hex);
            composite.set(mediaBytes, offset);
            offset += mediaBytes.length;
          }
          const finalHash = await crypto.subtle.digest('SHA-256', composite);
          computedHash = bytesToHex(new Uint8Array(finalHash));
        } else {
          computedHash = bytesToHex(textHashBytes);
        }

        if (computedHash !== proof.contentHash) {
          step.status = 'fail';
          step.label = 'Content hash mismatch';
          step.detail = `Expected: ${proof.contentHash.substring(0, 16)}... Got: ${computedHash.substring(0, 16)}...`;
          updateContent(postCardHtml + renderFailBanner('The content hash does not match. The post text may have been modified.'));
          return;
        }

        step.status = 'pass';
        step.label = 'Content hash verified';
        const mediaDetail = hasMedia ? ` (${mediaHashes.length} media hash${mediaHashes.length === 1 ? '' : 'es'} included)` : '';
        step.detail = `SHA-256: ${computedHash.substring(0, 32)}...${mediaDetail}`;
        updateContent(postCardHtml);

        // Step 6: Validate Apple certificate chain
        step = addStep('Validating Apple certificate chain...');
        updateContent(postCardHtml);

        const attestationBytes = base64ToBytes(proof.attestationObject);
        const attestation = CBORDecoder.decode(attestationBytes.buffer);

        const x5c = attestation.attStmt?.x5c;
        if (!x5c || x5c.length < 2) {
          step.status = 'fail';
          step.label = 'No certificates in attestation';
          updateContent(postCardHtml + renderFailBanner('The attestation object does not contain a valid certificate chain.'));
          return;
        }

        const leafCert = await verifyCertificateChain(x5c, APPLE_APP_ATTEST_ROOT_CA_PEM);

        step.status = 'pass';
        step.label = 'Apple certificate chain verified';
        step.detail = `${x5c.length} certificate(s) verified against Apple App Attest Root CA`;
        updateContent(postCardHtml);

        // Step 7: Verify attestation binding
        step = addStep('Verifying attestation binding...');
        updateContent(postCardHtml);

        const attestAuthData = attestation.authData;
        if (!attestAuthData) throw new Error('No authenticator data in attestation');

        const assertionBytes = base64ToBytes(proof.assertion);
        const assertion = CBORDecoder.decode(assertionBytes.buffer);
        if (!assertion.authenticatorData) throw new Error('No authenticator data in assertion');

        const attestParsed = parseAuthenticatorData(attestAuthData, true);
        const assertParsed = parseAuthenticatorData(assertion.authenticatorData, false);

        // Verify nonce extension in leaf cert
        await verifyAttestationNonce(leafCert, attestAuthData, proof.keyId);

        // Check AAGUID (production or sandbox)
        const prodAAGUID = new Uint8Array([0x61,0x70,0x70,0x61,0x74,0x74,0x65,0x73,0x74,0x00,0x00,0x00,0x00,0x00,0x00,0x00]);
        const devAAGUID = new Uint8Array([0x61,0x70,0x70,0x61,0x74,0x74,0x65,0x73,0x74,0x64,0x65,0x76,0x65,0x6c,0x6f,0x70]);
        const aaguidOk = attestParsed.aaguid.length === 16 &&
          (attestParsed.aaguid.every((b, i) => b === prodAAGUID[i]) ||
           attestParsed.aaguid.every((b, i) => b === devAAGUID[i]));
        if (!aaguidOk) throw new Error('Invalid AAGUID — not an Apple App Attest device');

        // Check credentialId matches keyId
        const keyIdBytes = base64ToBytes(proof.keyId);
        if (attestParsed.credentialId.length !== keyIdBytes.length ||
            !attestParsed.credentialId.every((b, i) => b === keyIdBytes[i])) {
          throw new Error('Credential ID does not match key ID');
        }

        // Check rpIdHash matches between attestation and assertion
        if (!attestParsed.rpIdHash.every((b, i) => b === assertParsed.rpIdHash[i])) {
          throw new Error('RP ID hash mismatch between attestation and assertion');
        }

        step.status = 'pass';
        step.label = 'Attestation bound to device key';
        step.detail = 'Nonce ✓ · AAGUID ✓ · Credential ID ✓ · RP ID ✓';
        updateContent(postCardHtml);

        // Step 8: Verify P-256 ECDSA signature
        step = addStep('Verifying P-256 ECDSA signature...');
        updateContent(postCardHtml);

        const publicKey = await importPublicKeyFromCert(x5c[0]);

        const signature = assertion.signature;
        const authenticatorData = assertion.authenticatorData;

        if (!signature || !authenticatorData) {
          step.status = 'fail';
          step.label = 'Invalid assertion format';
          updateContent(postCardHtml + renderFailBanner('The assertion is missing signature or authenticator data.'));
          return;
        }

        // Compute nonce: SHA-256(authenticatorData || contentHashBytes)
        const contentHashBytes = hexToBytes(proof.contentHash);
        const nonceInput = new Uint8Array(authenticatorData.length + contentHashBytes.length);
        nonceInput.set(authenticatorData, 0);
        nonceInput.set(contentHashBytes, authenticatorData.length);
        const nonce = await crypto.subtle.digest('SHA-256', nonceInput);

        const rawSig = derToRaw(signature);

        const isValid = await crypto.subtle.verify(
          { name: 'ECDSA', hash: 'SHA-256' },
          publicKey,
          rawSig,
          nonce
        );

        if (!isValid) {
          step.status = 'fail';
          step.label = 'Signature verification failed';
          updateContent(postCardHtml + renderFailBanner('The ECDSA signature does not match. The proof may be invalid.'));
          return;
        }

        step.status = 'pass';
        step.label = 'P-256 ECDSA signature verified';
        updateContent(postCardHtml);

        // ── All checks passed ──
        const successHtml = `
          <div class="result-banner verified">
            <h2>✓ Verified</h2>
            <p>This post was typed by a human on a genuine Apple device using Speakwrite.<br>
            Input was restricted to soft keyboard only &mdash; no paste, no dictation, no autocorrect.<br>
            The content hash was signed by the device's Secure Enclave via App Attest.</p>
          </div>
          <div class="verify-cta">
            <h3>What is Speakwrite?</h3>
            <p>Speakwrite is an AT Protocol client that creates cryptographic proof a post was typed by a human. Open protocol. Hardware-backed. No trust required.</p>
            <div class="btn-row">
              <a href="${TEST_FLIGHT_URL}" class="btn btn-primary">Try Speakwrite</a>
              <a href="/" class="btn btn-secondary">Learn More</a>
            </div>
          </div>`;

        updateContent(postCardHtml + successHtml);

      } catch (err) {
        const msg = err.message || `${err.name || 'Error'}: cryptographic verification failed`;
        const lastStep = steps[steps.length - 1];
        if (lastStep) {
          lastStep.status = 'fail';
          lastStep.label = msg;
        }
        const postCardEl = content.querySelector('.post-card');
        const postCardHtml = postCardEl ? postCardEl.outerHTML : '';
        updateContent(postCardHtml + renderFailBanner(msg));
      }
    }

    function renderFailBanner(message) {
      return `
        <div class="result-banner failed">
          <h2>✗ Verification Failed</h2>
          <p>${message}</p>
        </div>
        <div class="verify-cta">
          <h3>What is Speakwrite?</h3>
          <p>Speakwrite is an AT Protocol client that creates cryptographic proof a post was typed by a human. Open protocol. Hardware-backed. No trust required.</p>
          <div class="btn-row">
            <a href="${TEST_FLIGHT_URL}" class="btn btn-primary">Try Speakwrite</a>
            <a href="/" class="btn btn-secondary">Learn More</a>
          </div>
        </div>`;
    }

    // ── Extract public key from X.509 DER certificate (auto-detects P-256/P-384) ──
    async function importPublicKeyFromCert(certDer) {
      const cert = parseX509Certificate(certDer);
      const spkiBytes = new Uint8Array(cert.spki);

      // Detect curve from SPKI OID
      const p256Oid = [0x06, 0x08, 0x2a, 0x86, 0x48, 0xce, 0x3d, 0x03, 0x01, 0x07];
      const p384Oid = [0x06, 0x05, 0x2b, 0x81, 0x04, 0x00, 0x22];

      let curve = null;
      for (let i = 0; i < spkiBytes.length - 6; i++) {
        if (matchBytes(spkiBytes, i, p256Oid)) { curve = 'P-256'; break; }
        if (matchBytes(spkiBytes, i, p384Oid)) { curve = 'P-384'; break; }
      }
      if (!curve) throw new Error('Unsupported curve in certificate SPKI');

      return await crypto.subtle.importKey(
        'spki', cert.spki,
        { name: 'ECDSA', namedCurve: curve },
        false, ['verify']
      );
    }

    // ── Run ──
    verify();
  </script>

</body>

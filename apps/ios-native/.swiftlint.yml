disabled_rules:
  - line_length
  - trailing_whitespace
  - todo

opt_in_rules:
  - force_unwrapping
  - empty_count
  - closure_end_indentation

excluded:
  - build/
  - DerivedData/
  - .build/

# Warning, not error: the codebase has many static-string URL(string:)! force
# unwraps that are safe but numerous — error severity kept CI permanently red.
# New code should still prefer guard-let; the warning keeps them visible.
force_unwrapping:
  severity: warning

file_length:
  warning: 500
  error: 1000

type_body_length:
  warning: 400
  error: 800

function_body_length:
  warning: 60
  error: 100

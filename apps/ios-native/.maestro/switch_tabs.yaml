appId: io.speakwrite.app
tags:
  - smoke
  - navigation
name: Switch Tabs
---
- launchApp

# Start on Home tab
- assertVisible: "Following"

# Switch to Verified tab
- tapOn: "Verified"
- assertVisible:
    id: "verified-feed"

# Switch to Activity tab
- tapOn: "Activity"

# Switch to Profile tab
- tapOn: "Profile"
- assertVisible:
    id: "my-profile-header"

# Open compose from the FAB and cancel back out
- tapOn:
    id: "compose_fab"
- assertVisible: "What's on your mind?"
- tapOn:
    id: "compose-cancel"

# Rapid tab switching stress test
- tapOn: "Home"
- tapOn: "Verified"
- tapOn: "Activity"
- tapOn: "Profile"
- tapOn: "Home"

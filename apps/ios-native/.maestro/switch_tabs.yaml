appId: io.speakwrite.app
tags:
  - smoke
  - navigation
name: Switch Tabs
---
- launchApp

# Start on Write tab (default), then go to Feed
- assertVisible:
    id: "compose-editor"
- tapOn: "Feed"
- assertVisible: "Following"

# Switch to Record tab
- tapOn: "Record"
- assertVisible:
    id: "verified-feed"

# Switch to Compose tab
- tapOn: "Write"
- assertVisible: "What's on your mind?"

# Switch to Settings tab
- tapOn: "Settings"
- assertVisible: "Appearance"

# Go back through tabs
- tapOn: "Record"
- tapOn: "Feed"

# Rapid tab switching stress test
- tapOn: "Settings"
- tapOn: "Write"
- tapOn: "Record"
- tapOn: "Feed"
- tapOn: "Settings"
- tapOn: "Feed"

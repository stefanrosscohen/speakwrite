appId: io.speakwrite.app
tags:
  - smoke
  - auth
name: Login Flow
---
- launchApp:
    clearState: true

# Login screen should be visible
- assertVisible: "Prove a human wrote it."
- assertVisible: "Sign in"

# Enter handle
- tapOn:
    id: "handle-field"
- inputText: "testuser.bsky.social"

# Toggle custom PDS field open and closed
- tapOn: "Bluesky (bsky.social)"
- assertVisible: "Custom PDS"
- tapOn: "Custom PDS"

# Tap sign in (will trigger OAuth - can't fully automate beyond this)
- tapOn: "Sign in"

# Note: OAuth web flow requires manual interaction
# This test validates the login UI is functional up to the OAuth handoff

appId: io.speakwrite.app
tags:
  - smoke
  - settings
name: Settings
---
- launchApp

# Settings lives behind the Profile tab's gear button
- tapOn: "Profile"
- tapOn:
    id: "settings-button"

# Appearance section should be visible
- assertVisible: "Appearance"

# Account info should be visible
- assertVisible:
    id: "account-info"

# Sign Out button should exist (but don't tap it)
- assertVisible: "Sign Out"

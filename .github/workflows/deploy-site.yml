name: Deploy Site + App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build the web app + reader (builds core first)
      - run: pnpm build:web
      - run: pnpm build:reader

      # Assemble the deployment: site at root, app at /app/, reader at /reader/
      - run: |
          mkdir -p _deploy/app _deploy/reader
          cp -r apps/site/* _deploy/
          cp -r apps/web/dist/* _deploy/app/
          cp -r apps/reader/dist/* _deploy/reader/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy

      - id: deployment
        uses: actions/deploy-pages@v4
